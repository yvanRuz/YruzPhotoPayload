
name: Initialiser Payload CMS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NODE_ENV: production

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifier les secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$PAYLOAD_SECRET"

      - name: Installer les dependances
        run: npm install

      - name: Generer la migration initiale
        run: npx payload migrate:create initial-schema --skip-empty

      - name: Sauvegarder les fichiers de migration
        uses: actions/upload-artifact@v4
        with:
          name: payload-migrations
          path: src/migrations/
          if-no-files-found: error

      - name: Creer les tables PostgreSQL
        run: npx payload migrate

      - name: Verifier les migrations
        run: npx payload migrate:status
